name: noti
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.2.1
  firebase_messaging: ^16.1.0
  cloud_functions: ^6.0.0
  flutter_local_notifications: ^19.5.0
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  crypto: ^3.0.6
  firebase_storage: ^13.4.5
  image_picker: ^1.2.3
  local_auth: ^2.3.0
  http: ^1.3.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/noti_logo.png
    - assets/images/noti_splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/noti_logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#5D55F6"
  adaptive_icon_foreground: assets/images/noti_logo.png

flutter_native_splash:
  color: "#5D55F6"
  image: assets/images/noti_splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#5D55F6"
    image: assets/images/noti_splash_logo.png
  fullscreen: true
